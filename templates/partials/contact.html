<section id="contact" class="section" aria-labelledby="contact-title">
  <div class="container">
    <div class="section__heading"><h2 id="contact-title">Share your ideas and get in touch with me.</h2></div>
    <div class="contact__grid">
      <div class="contact__info">
        <h3>Contact Me</h3>
        <dl class="contact__details">
          <dt>Name</dt>
          <dd>{{ data.profile.full_name }}</dd>
          <dt>based in</dt>
          <dd>{{ data.profile.location }}</dd>
          <dt>Email</dt>
          <dd>{{ data.profile.email }}</dd>
        </dl>
        <a class="button" href="mailto:{{ data.profile.email }}">Send Email</a>
      </div>
      <form class="contact__form" method="post" data-contact-form data-whatsapp="6281339107301">
        <div class="contact__field">
          <label for="contact-name">Full Name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" required />
        </div>

        <div class="contact__field">
          <label for="contact-email">Email address</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="contact__field">
          <label for="contact-message">share your ideas</label>
          <textarea id="contact-message" name="message" rows="4" required></textarea>
        </div>

        <button class="button" type="submit" data-contact-submit disabled>Whatsapp</button>

        <p class="contact__status" role="status" data-contact-status></p>
      </form>
    </div>
  </div>
</section>
